<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- no maximum-scale/user-scalable: that's a WCAG 1.4.4 fail. canvas gestures are handled by
     touch-action:none on #stage, so pinch still works on the panels where the text actually is. -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Talia Honikman</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="alternate" type="application/rss+xml" title="The Hedge" href="https://taliahonikman.substack.com/feed" />
<meta name="description" content="Talia Honikman — a personal site built as an orrery of intellectual interests: pragmatics, humanities- and linguistics-oriented AI, food science, film photography, writing, and violin." />
<meta name="author" content="Talia Honikman" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Talia Honikman" />
<meta property="og:description" content="An orrery of intellectual interests — pragmatics, AI, food science, photography, writing, violin." />
<meta name="twitter:card" content="summary_large_image" />
<meta property="og:url" content="https://taliaduckie.github.io/orrery/" />
<meta property="og:image" content="https://taliaduckie.github.io/orrery/preview.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:image" content="https://taliaduckie.github.io/orrery/preview.png" />
<meta name="robots" content="index, follow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="stage"></canvas>
  <canvas id="comet"></canvas>

  <!-- text layer for search engines & screen readers (the orrery is canvas-only); built from content.js -->
  <main id="a11y" class="sr-only"></main>
  <noscript>
    <div class="noscript">
      <h1>Talia Honikman</h1>
      <p>Curious about the gap between what's said and what's meant — pragmatics, language models, photography, and food.</p>
      <p><a href="mailto:tbhonikman@gmail.com">email</a> ·
         <a href="https://www.linkedin.com/in/talia-b-honikman/">LinkedIn</a> ·
         <a href="https://taliahonikman.substack.com/">Substack</a> ·
         <a href="https://github.com/taliaduckie">GitHub</a></p>
    </div>
  </noscript>

  <div id="tip"><div class="t-name"></div><div class="t-desc"></div></div>

  <div id="moonPanel">
    <button class="m-close" aria-label="close">&times;</button>
    <div class="m-domain"></div>
    <div class="m-title"></div>
    <div class="m-body"></div>
    <div class="m-links"></div>
  </div>

  <div id="aboutPanel">
    <button class="a-close" aria-label="close">&times;</button>
    <div class="a-kicker"></div>
    <h1 class="a-name"></h1>
    <div class="a-body"></div>
    <div class="a-links"></div>
  </div>

  <div id="photoPeek"><img alt="" /></div>

  <nav id="social"></nav>

  <button id="backBtn">&larr; pull back</button>
  <div id="hint">click the sun for the tldr &nbsp;·&nbsp; click a planet to enter &nbsp;·&nbsp; esc to pull back</div>

  <!-- content.js holds all the words/numbers; orrery.js is the engine -->
  <script src="content.js"></script>
  <script src="a11y.js"></script>
  <script src="orrery.js"></script>
</body>
</html>
